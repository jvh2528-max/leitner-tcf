<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>Leitner TCF</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand-wrap">
        <div class="brand-icon">📚</div>
        <div class="brand-text">
          <h1>Leitner TCF</h1>
          <p>یادگیری هوشمند لغات</p>
        </div>
      </div>
      <div class="streak-badge">
        <span>🔥</span>
        <b id="streakCount">0</b>
        <small>استریک</small>
      </div>
    </header>

    <section class="hero-card">
      <div class="hero-left">
        <div class="hero-label">مرور امروز</div>
        <div class="hero-number" id="dueCount">0</div>
        <div class="hero-sub">کارت آماده مرور</div>
      </div>
      <div class="hero-right">
        <button id="startReviewBtn" class="hero-btn">شروع مرور ▶</button>
      </div>
    </section>

    <section class="section-head">
      <h2>خانه‌های لایتنر</h2>
      <span id="totalCount" class="tiny-pill">0 کارت</span>
    </section>

    <section id="boxes" class="boxes-list"></section>

    <section class="actions-grid">
      <button class="action-btn" id="allCardsBtn">همه کارت‌ها ☰</button>
      <button class="action-btn" id="addCardBtn">کارت جدید ＋</button>
      <button class="action-btn" id="backupBtn">پشتیبان‌گیری ⤴</button>
      <label class="action-btn file-label">بازیابی ⤵
        <input type="file" id="restoreInput" accept="application/json" hidden />
      </label>
    </section>

    <nav class="bottom-nav">
      <button class="nav-item active">
        <span>⌂</span>
        <small>خانه</small>
      </button>
      <button class="nav-item">
        <span>◔</span>
        <small>مرور</small>
      </button>
      <button class="nav-item">
        <span>▥</span>
        <small>آمار</small>
      </button>
      <button class="nav-item" id="settingsBtn">
        <span>⚙</span>
        <small>تنظیمات</small>
      </button>
    </nav>
  </main>

  <dialog id="addDialog" class="sheet-dialog">
    <form method="dialog" id="addForm" class="sheet-form">
      <div class="sheet-head">
        <h3>کارت جدید</h3>
        <button value="cancel" class="close-btn" aria-label="بستن">✕</button>
      </div>

      <label>فارسی
        <textarea id="backInput" required placeholder="مثلاً باعث شدن"></textarea>
      </label>

      <label>فرانسوی
        <input id="frontInput" required placeholder="مثلاً entraîner" dir="ltr" />
      </label>

      <label>مثال
        <textarea id="exampleInput" placeholder="Phrase exemple" dir="ltr"></textarea>
      </label>

      <label>موضوع
        <input id="topicInput" placeholder="Voyage / TCF / Travail ..." />
      </label>

      <button value="default" id="saveCardBtn" class="primary-btn full">ذخیره کارت</button>
    </form>
  </dialog>

  <dialog id="reviewDialog" class="review-dialog">
    <div class="review-shell">
      <div class="review-top">
        <button id="closeReviewBtn" class="close-btn">✕</button>
        <div class="review-badges">
          <span id="reviewProgress" class="tiny-pill">0 / 0</span>
          <span id="currentBoxBadge" class="tiny-pill">خانه 1</span>
        </div>
      </div>

      <div id="reviewCard" class="flashcard">
        <div class="topic" id="reviewTopic"></div>
        <div class="prompt-label">فارسی</div>
        <div class="persian-prompt" id="reviewBack"></div>

        <div id="answerArea" class="answer-area hidden">
          <div class="divider"></div>
          <div class="answer-label">فرانسوی</div>
          <div class="french-answer" id="reviewFront"></div>
          <div class="example" id="reviewExample"></div>
        </div>

        <p class="tap-hint" id="tapHint">اول حدس بزن، بعد جواب رو ببین</p>
      </div>

      <div id="revealControls">
        <button id="revealBtn" class="primary-btn full">نمایش جواب</button>
      </div>

      <div id="gradeControls" class="grade-controls hidden">
        <button id="dontKnowBtn" class="soft-danger">بلد نیستم ↩</button>
        <button id="knowBtn" class="soft-success">بلدم ✓</button>
      </div>
    </div>
  </dialog>

  <dialog id="cardsDialog" class="sheet-dialog">
    <div class="sheet-form">
      <div class="sheet-head">
        <h3 id="cardsTitle">همه کارت‌ها</h3>
        <button id="closeCardsBtn" class="close-btn">✕</button>
      </div>
      <div id="cardsList" class="cards-list"></div>
    </div>
  </dialog>

  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
